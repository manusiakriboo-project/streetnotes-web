<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>streetnotes.online — Global Urban Street Archive</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            asphalt: '#0c0c0c',
            cardbg: '#141414',
            concrete: '#262626',
            hazard: '#ff5500',
            paper: '#f4f1ea',
            sticky: '#facc15',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0c0c0c;
      color: #f4f1ea;
      background-image: radial-gradient(#222 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .brutal-shadow {
      box-shadow: 4px 4px 0px #ff5500;
    }
    .brutal-shadow-white {
      box-shadow: 4px 4px 0px #f4f1ea;
    }
    .receipt-edge {
      background-image: linear-gradient(135deg, #0c0c0c 50%, transparent 50%), linear-gradient(225deg, #0c0c0c 50%, transparent 50%);
      background-position: top left, top left;
      background-size: 12px 12px;
      background-repeat: repeat-x;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0c0c0c; }
    ::-webkit-scrollbar-thumb { background: #262626; }
    ::-webkit-scrollbar-thumb:hover { background: #ff5500; }
  </style>
</head>

  <!-- Top Ticker Bar -->
  <div class="bg-hazard text-black text-xs font-bold py-1.5 px-4 border-b-2 border-black flex justify-between items-center tracking-wider uppercase">
    <span>● LIVE ARCHIVE // STREETNOTES.ONLINE</span>
    <span class="hidden sm:inline">WORLDWIDE SIDEWALK & WALL DOCUMENTATION</span>
    <span id="post-counter">000 ENTRIES</span>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <!-- Brand -->
      <a href="#" onclick="resetFilters()" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 bg-hazard text-black font-sans font-bold flex items-center justify-center text-lg border border-black group-hover:rotate-6 transition-transform">
          SN
        </div>
        <div>
          <span class="font-sans font-bold text-lg sm:text-xl tracking-tight text-white">streetnotes<span class="text-hazard">.online</span></span>
        </div>
      </a>

      <!-- Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button onclick="handleOpenSubmit()" class="bg-hazard hover:bg-orange-600 text-black font-bold text-xs sm:text-sm px-3 sm:px-4 py-2 border border-black uppercase tracking-wider flex items-center gap-1.5 transition-transform active:translate-y-0.5">
          <i data-lucide="plus-square" class="w-4 h-4"></i>
          <span>Submit Note</span>
        </button>

        <!-- Auth State Container -->
        <div id="auth-controls" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>

  <!-- Hero / Filter Strip -->

          Found on walls, poles &amp; pavements.
